[build]
command = "curl -sL https://github.com/gohugoio/hugo/releases/download/v0.42/hugo_0.42_Linux-64bit.tar.gz | tar xz && ./hugo"
publish = "public"

[context]
[context.branch-deploy]
command = "curl -sL https://github.com/gohugoio/hugo/releases/download/v0.42/hugo_0.42_Linux-64bit.tar.gz | tar xz && ./hugo -F -b $DEPLOY_PRIME_URL"
[context.deploy-preview]
command = "curl -sL https://github.com/gohugoio/hugo/releases/download/v0.42/hugo_0.42_Linux-64bit.tar.gz | tar xz && ./hugo -F -b $DEPLOY_PRIME_URL"
[context.production]
[context.production.environment]
HUGO_ENV = "production"

# --- /learn/ is a Next.js app on Vercel, served under this domain (subfolder, not subdomain).
# The X-Pseo-Proxy header tells the origin the request came through this proxy; direct hits on
# the *.vercel.app origin are served with X-Robots-Tag: noindex so only these URLs get indexed.
[[redirects]]
  from = "/learn/*"
  to = "https://chatomics-learn.vercel.app/learn/:splat"
  status = 200
  force = true
  headers = {X-Pseo-Proxy = "128f1ae0c3001d33a51e978790bd7db7fbbcb4b878979558"}

# Bare /learn (no trailing slash). Netlify matches "/learn" for "/learn/" as well, so this must
# be a 200 proxy, never a redirect to "/learn/" (that loops).
[[redirects]]
  from = "/learn"
  to = "https://chatomics-learn.vercel.app/learn/"
  status = 200
  force = true
  headers = {X-Pseo-Proxy = "128f1ae0c3001d33a51e978790bd7db7fbbcb4b878979558"}
